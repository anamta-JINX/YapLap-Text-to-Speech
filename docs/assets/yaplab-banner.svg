<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">YapLab — Make It Yap</title>
  <desc id="desc">Branded YapLab banner in lime, coral, cream, and black with the slogan Your words called. They wanna yap.</desc>
  <rect width="1600" height="520" fill="#f7f3e8"/>
  <rect x="0" y="0" width="1600" height="80" fill="#d9ff45"/>
  <path d="M0 80H1600" stroke="#111111" stroke-width="5"/>
  <g transform="translate(72 22)">
    <text x="0" y="39" font-family="Arial Black, Arial, sans-serif" font-size="39" font-weight="900" fill="#111111">YapLab</text>
    <g transform="translate(158 8)" stroke="#82bd00" stroke-width="7" stroke-linecap="round">
      <path d="M17 0v34"/><path d="M2 8l30 18"/><path d="M32 8L2 26"/>
    </g>
  </g>
  <g transform="translate(82 140)">
    <text x="0" y="95" font-family="Arial Black, Arial, sans-serif" font-size="118" font-weight="900" fill="#111111" letter-spacing="-5">MAKE IT</text>
    <g transform="translate(238 86)">
      <text x="9" y="115" font-family="Arial Black, Arial, sans-serif" font-size="132" font-weight="900" fill="#d9ff45" stroke="#d9ff45" stroke-width="8">YAP.</text>
      <text x="0" y="106" font-family="Arial Black, Arial, sans-serif" font-size="132" font-weight="900" fill="#ff5b3f" stroke="#111111" stroke-width="5" paint-order="stroke">YAP.</text>
    </g>
  </g>
  <g transform="translate(980 135)">
    <rect x="0" y="0" width="510" height="270" rx="18" fill="#ffffff" stroke="#111111" stroke-width="5"/>
    <rect x="16" y="16" width="510" height="270" rx="18" fill="none" stroke="#111111" stroke-width="5"/>
    <text x="42" y="70" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800" fill="#111111">TEXT → VOICE → VIBES</text>
    <text x="42" y="124" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#111111">Expressive speech with</text>
    <text x="42" y="162" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#111111">voices, accents + emotion.</text>
    <rect x="42" y="194" width="380" height="52" rx="6" fill="#d9ff45" stroke="#111111" stroke-width="3"/>
    <text x="61" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="800" fill="#111111">YOUR WORDS CALLED.</text>
  </g>
  <g transform="translate(80 444)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#111111">Your words called. They wanna yap.</text>
    <path d="M510 -8h260" stroke="#ff5b3f" stroke-width="10" stroke-linecap="round"/>
    <circle cx="790" cy="-8" r="16" fill="#d9ff45" stroke="#111111" stroke-width="4"/>
    <path d="M1120 -26l44 18-44 18 12-18z" fill="#ff5b3f" stroke="#111111" stroke-width="3"/>
  </g>
