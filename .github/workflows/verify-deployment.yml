name: Verify deployment

on:
  push:
    branches:
      - main
      - fix/vercel-python-startup
    paths:
      - app.py
      - requirements.txt
      - vercel.json
      - backend/**
      - frontend/out/**
      - tests/**
      - .github/workflows/verify-deployment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Run voice parameter tests
        run: python -m unittest discover -s tests -v
      - name: Verify startup, UI assets, API, and real speech
        run: python -m backend.verify_deployment --speech
